    <!-- Apply the saved theme before first paint, so reloading on the cyber
         theme doesn't flash the light canvas. Kept inline and tiny on purpose. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          document.documentElement.dataset.theme = t === 'cyber' ? 'cyber' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
