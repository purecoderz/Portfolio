<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#darkBg)" stroke="url(#cyanGrad)" stroke-width="2"/>

  <!-- Icon Elements (Code Brackets + Slash Monogram) -->
  <!-- Left Bracket < -->
  <path d="M 36 36 L 25 50 L 36 64" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M 64 36 L 75 50 L 64 64" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Slash / T-Bar -->
  <path d="M 43 65 L 57 35" fill="none" stroke="url(#purpleGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 43 35 L 57 35" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Typography -->
  <!-- Main Name/Brand -->
  <text x="115" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" letter-spacing="1">
    TAOFEEK<tspan fill="url(#cyanGrad)">.</tspan>DEV
  </text>
  
  <!-- Sub-headline -->
  <text x="115" y="73" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="3.5">
    BACKEND SOFTWARE ENGINEER
  </text>
</svg>
